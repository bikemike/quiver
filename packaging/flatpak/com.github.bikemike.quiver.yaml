app-id: com.github.bikemike.quiver
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: quiver

finish-args:
  # Display & Graphics
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Audio playback for videos
  - --socket=pulseaudio
  # Filesystem access for browsing and managing photos
  - --filesystem=host
  - --filesystem=xdg-pictures:ro
  # D-Bus integration
  - --own-name=com.github.bikemike.quiver

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/pkgconfig
  - '*.a'
  - '*.la'

modules:
  - name: exiv2
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DEXIV2_BUILD_SAMPLES=OFF
      - -DEXIV2_BUILD_UNIT_TESTS=OFF
      - -DEXIV2_ENABLE_NLS=OFF
      - -DEXIV2_ENABLE_WEB_READY=OFF
      - -DEXIV2_ENABLE_INIH=OFF
      - -DEXIV2_ENABLE_BROTLI=OFF
    sources:
      - type: git
        url: https://github.com/Exiv2/exiv2.git
        tag: v0.28.2
        commit: 04207b9c39bf7b3b1a7144f7ed4e4f16b4f29ef6

  - name: boost-headers
    buildsystem: simple
    build-commands:
      - mkdir -p /app/include
      - cp -r boost /app/include/
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.bz2
        sha256: cc4b893acf645c9d4b698e9a0f08ca8846aa5d6c68275c14c3e7949c24109454

  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --prefix=/app
      - --disable-programs
      - --disable-doc
      - --disable-static
      - --enable-shared
      - --disable-yasm
      - --disable-asm
      - --enable-gpl
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-6.1.2.tar.xz
        sha256: 3b624649725ecdc565c903ca6643d41f33bd49239922e45c9b1442c63dca4e38

  - name: quiver
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
