name: Package & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # 1. Debian / Ubuntu package (.deb) & tarball via CPack
  # --------------------------------------------------------------------------
  build-deb:
    name: Build DEB & Tarball (CPack)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkgconf file dpkg-dev \
            libgtk-4-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libexiv2-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libjpeg-dev zlib1g-dev libboost-dev \
            libgdk-pixbuf-2.0-dev \
            libshumate-dev libsoup-3.0-dev libjson-glib-dev \
            catch2 xvfb \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_GLYCIN=OFF \
            -DENABLE_GDK_PIXBUF=ON \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Run Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Package with CPack (.deb & .tar.gz)
        run: |
          cd build
          cpack -G DEB
          cpack -G TGZ

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiver-deb
          path: build/*.deb

      - name: Upload Tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiver-tarball
          path: build/*.tar.gz

  # --------------------------------------------------------------------------
  # 2. AppImage package via linuxdeploy
  # --------------------------------------------------------------------------
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkgconf wget file libfuse2t64 \
            libgtk-4-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libexiv2-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libjpeg-dev zlib1g-dev libboost-dev \
            libgdk-pixbuf-2.0-dev \
            libshumate-dev libsoup-3.0-dev libjson-glib-dev

      - name: Build AppImage
        run: ./packaging/appimage/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiver-appimage
          path: Quiver-*.AppImage

  # --------------------------------------------------------------------------
  # 3. Flatpak package
  # --------------------------------------------------------------------------
  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Quiver.flatpak
          manifest-path: packaging/flatpak/com.github.bikemike.quiver.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiver-flatpak
          path: Quiver.flatpak

  # --------------------------------------------------------------------------
  # 4. Snap package
  # --------------------------------------------------------------------------
  build-snap:
    name: Build Snap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install LXD and Snapcraft
        run: |
          install_snap() {
            name="$1"
            shift
            if snap list "${name}" >/dev/null 2>&1; then
              return 0
            fi
            for attempt in 1 2 3 4 5; do
              if sudo snap install "$@"; then
                return 0
              fi
              echo "Installing ${name} failed (attempt ${attempt}); retrying..."
              sleep $((attempt * 15))
            done
            return 1
          }

          install_snap lxd lxd
          install_snap snapcraft --channel=stable --classic snapcraft

          sudo usermod -aG lxd "${USER}"
          sudo lxd waitready --timeout=120
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT
          if sudo iptables -nL DOCKER-USER >/dev/null 2>&1; then
            sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi

      - name: Build Snap
        run: sg lxd -c 'SNAPCRAFT_BUILD_INFO=1 snapcraft --use-lxd'

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiver-snap
          path: ./*.snap

  # --------------------------------------------------------------------------
  # 5. Create GitHub Release on Tags
  # --------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build-deb, build-appimage, build-flatpak, build-snap]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/*.AppImage
            release-assets/*.flatpak
            release-assets/*.snap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
